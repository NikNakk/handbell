name: Import CC0 bell recording
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-bell.yml'
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure ffprobe is installed
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version
      - name: Download original CC0 bronze bell sample
        run: |
          set -euo pipefail
          if [ -s bell.mp3 ]; then exit 0; fi
          curl --fail --location --retry 3 --max-time 60 'https://bigsoundbank.com/UPLOAD/mp3/2704.mp3' -o /tmp/bronze.mp3
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/bronze.mp3 | grep -q mp3
          cp /tmp/bronze.mp3 bell.mp3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bell.mp3
          git commit -m 'Bundle CC0 bronze handbell recording'
          git pull --rebase origin main
          git push origin HEAD:main
